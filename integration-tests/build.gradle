plugins {
    id 'java'
    id "com.diffplug.spotless" version "6.2.1"
}

group = 'io.spring'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'
targetCompatibility = '11'

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.8.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.rest-assured:rest-assured:4.5.1'
    testImplementation 'io.rest-assured:json-path:4.5.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.1'
    testImplementation 'org.testcontainers:testcontainers:1.21.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.slf4j:slf4j-simple:1.7.36'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    // Pass through an already running stack (e.g. `docker compose up`) instead of starting one.
    systemProperty 'monolith.url', System.getenv('MONOLITH_URL') ?: ''
    systemProperty 'comments.url', System.getenv('COMMENTS_SERVICE_URL') ?: ''
    // docker-java defaults to Docker API 1.32, which daemons >= 25 reject (min 1.40). 1.41 works with
    // Docker 20.10+; override with DOCKER_API_VERSION if your daemon needs something else.
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.41'
    outputs.upToDateWhen { false }
}
