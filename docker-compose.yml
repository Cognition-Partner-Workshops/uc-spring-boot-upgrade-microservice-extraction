services:
  comments-service:
    build:
      context: ./comments-service
    image: realworld/comments-service:local
    environment:
      COMMENTS_SERVICE_PORT: "8081"
      COMMENTS_DB_PATH: /app/data/comments.db
    ports:
      - "8081:8081"
    volumes:
      - comments-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  monolith:
    build:
      context: .
    image: realworld/monolith:local
    environment:
      MONOLITH_DB_PATH: /app/data/dev.db
      COMMENTS_SERVICE_URL: http://comments-service:8081
    ports:
      - "8080:8080"
    volumes:
      - monolith-data:/app/data
    depends_on:
      comments-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/tags"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

volumes:
  comments-data:
  monolith-data:
