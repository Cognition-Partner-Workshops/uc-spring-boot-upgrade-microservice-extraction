name: Build
on:
  push:
    branches: [demo-modernization]
  pull_request:
    branches: ['**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read target Java version
        id: java
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('build.gradle').read_text()
          match = re.search(r"sourceCompatibility\s*=\s*(?:JavaVersion.VERSION_)?['\"]?(\d+)", source)
          if not match:
              match = re.search(r'JavaLanguageVersion.of\((\d+)\)', source)
          if not match:
              raise SystemExit('Cannot determine Java version from build.gradle')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match[1]}\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: .github/scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
